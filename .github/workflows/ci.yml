name: CI

# Every push/PR: frontend typecheck + build, a production-dependency audit,
# clippy (warnings are errors), the Rust test suite, and a RustSec advisory
# check. Cross-platform bundling lives in release.yml.
on:
  push:
    branches: ["main", "spike/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev build-essential file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + frontend build
        run: npm run build

      # Only production dependencies ship in the app; dev tooling (vite etc.)
      # runs on developer machines. High severity fails the build; moderate
      # findings are triaged by hand.
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      # Tauri's build.rs verifies the externalBin resource exists, even for
      # `cargo check`. CI never bundles, so a stub file at the host triple's path
      # is enough. The frostd end-to-end tests skip themselves when they find
      # the empty stub instead of a real binary.
      - name: Stub sidecars for the resource check
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/frostd-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/cloudflared-x86_64-unknown-linux-gnu

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace

      # Known vulnerabilities, yanked crates and licenses outside the policy
      # fail the build; see src-tauri/deny.toml.
      - name: RustSec advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses
