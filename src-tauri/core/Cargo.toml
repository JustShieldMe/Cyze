[package]
name = "frost-app-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
frost-client = { workspace = true }
frost-core = { workspace = true }
frost-ed25519 = { workspace = true }
frost-rerandomized = { workspace = true }
reddsa = { workspace = true }
reqwest = { workspace = true }
# Exact-certificate pinning for self-signed frostd servers (transport.rs);
# the version and ring provider reqwest already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
bip39 = { workspace = true }
rcgen = { workspace = true }
postcard = { workspace = true }
bech32 = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# Not used directly: pins the transitive xeddsa version for frost-client,
# which breaks against xeddsa 1.1 (rand_core trait changes).
xeddsa = "=1.0.2"

# Optional Zcash key/address derivation. Behind a feature so the heavy
# orchard/halo2 dependency tree stays out of the default build.
#
# The Zcash crates come from the Zakura stack (zakura-core/common and
# zakura-core/wallet-libraries): published forks of the ECC crates, with the
# upstream library names kept, so `use orchard::…` and friends are unchanged.
# Its Orchard tree hashing is ~7x faster than upstream's, and tree hashing is
# ~78% of a sync's scan time (docs/SYNC_OPTIMIZATION.md). Versions are pinned
# exactly to one consistent family: the stable 4.0 crypto crates with wallet
# libraries rc9.3 (the newest; they have no stable release yet). Ranges would
# let cargo mix families, whose types don't interoperate.
#
# NU7: 4.0 carries mainnet's NU7 activation (height 3,543,405) and its block
# spacing, so the wallet keeps building valid transactions across it. The 3.x
# crates would commit to NU6.3's branch after NU7 and be rejected. orchard keeps the
# `unstable-frost` feature Cyze's threshold signing needs; `weighted-merkle`
# is Zakura's fast tree hashing.
orchard = { package = "zakura-orchard", version = "=4.0.0", optional = true, features = ["unstable-frost", "weighted-merkle"] }
zcash_address = { package = "zakura-address", version = "=4.0.0", optional = true }
pasta_curves = { package = "zakura-pasta-curves", version = "=4.0.0", optional = true }
ff = { version = "0.14", optional = true }

# Wallet/light-client stack (feature `wallet`). Heavy: pulls the zcash
# light-client backend, lightwalletd gRPC, PCZT builder, and sqlite.
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc9.3", optional = true, default-features = false, features = [
    "orchard",
    "sync",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
    "pczt",
] }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc9.3", optional = true, features = ["orchard", "transparent-inputs", "unstable", "serde"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc9", optional = true, features = ["signer"] }
zcash_keys = { package = "zakura-keys", version = "=4.0.0", optional = true, features = ["orchard"] }
# `local-consensus` exposes `LocalNetwork`, the regtest parameters used for a
# local devnet (see `WalletNetwork::Regtest`).
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0", optional = true, features = ["local-consensus"] }
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "tls-webpki-roots"] }
# SQLCipher (bundled amalgamation) so the per-group wallet database is encrypted
# at rest. Feature-unifies with zcash_client_sqlite's `bundled` rusqlite: the
# single libsqlite3-sys build compiles the SQLCipher amalgamation. Uses vendored
# OpenSSL (compiled from source) so no system libssl-dev / openssl headers are
# required on the build machine — only a C toolchain + perl.
rusqlite = { version = "0.37", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }
prost = { version = "0.14", optional = true }
async-trait = { version = "0.1", optional = true }
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0", optional = true }
# The `rand` generation the Zakura wallet crates use (WalletDb's RNG).
rand10 = { package = "rand", version = "0.10", optional = true, default-features = false, features = ["sys_rng"] }
# Co-signer verification (wallet/verify.rs): memo recovery and transparent
# recipients.
zcash_note_encryption = { package = "zakura-note-encryption", version = "=4.0.0", optional = true }
transparent = { package = "zakura-transparent", version = "=4.0.0", optional = true }

[features]
# Orchard FVK / unified-address derivation from group key material.
zcash = ["dep:orchard", "dep:zcash_address", "dep:pasta_curves", "dep:ff", "dep:zcash_protocol"]
# Light-client wallet: sync, balances, and PCZT transaction building.
wallet = [
    "zcash",
    "dep:zcash_client_backend",
    "dep:zcash_client_sqlite",
    "dep:zcash_keys",
    "dep:zcash_protocol",
    "dep:tonic",
    "dep:rusqlite",
    "dep:prost",
    "dep:async-trait",
    "dep:zcash_primitives",
    "dep:pczt",
    "dep:zcash_note_encryption",
    "dep:transparent",
    "dep:rand10",
]

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
# Building test PCZTs (wallet/verify.rs); versions match the zcash stack's.
shardtree = "0.7.1"
incrementalmerkletree = "0.8.2"

# Times a real wallet sync against lightwalletd; see the file header for usage.
[[example]]
name = "sync_bench"
required-features = ["wallet"]
