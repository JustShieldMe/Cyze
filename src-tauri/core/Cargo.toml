[package]
name = "frost-app-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
frost-client = { workspace = true }
frost-core = { workspace = true }
frost-ed25519 = { workspace = true }
frost-rerandomized = { workspace = true }
reddsa = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
bip39 = { workspace = true }
rcgen = { workspace = true }
postcard = { workspace = true }
bech32 = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# Not used directly: pins the transitive xeddsa version for frost-client,
# which breaks against xeddsa 1.1 (rand_core trait changes).
xeddsa = "=1.0.2"

# Optional Zcash key/address derivation. Behind a feature so the heavy
# orchard/halo2 dependency tree stays out of the default build.
#
# IRONWOOD/NU6.3: the zcash_* cohort tracks the PUBLISHED crates.io release wave
# (no git fork, no [patch.crates-io]). These carry the real NU6.3 branch id
# (0x37a5165b) and, crucially, Ironwood/V6 PCZT construction
# (zcash_client_backend 0.24 builds a version-6 tx with an Ironwood bundle from
# NU6.3 onward). orchard stays on the `unstable-frost` feature Cyze's threshold
# signing needs. zcash_client_backend/sqlite are release candidates; the rest
# are stable.
orchard = { version = "0.15.4", optional = true, features = ["unstable-frost"] }
zcash_address = { version = "0.13", optional = true }
pasta_curves = { version = "0.5", optional = true }
ff = { version = "0.13", optional = true }

# Wallet/light-client stack (feature `wallet`). Heavy: pulls the zcash
# light-client backend, lightwalletd gRPC, PCZT builder, and sqlite.
zcash_client_backend = { version = "=0.24.0-rc.7", optional = true, default-features = false, features = [
    "orchard",
    "sync",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
    "pczt",
] }
zcash_client_sqlite = { version = "=0.22.0-rc.8", optional = true, features = ["orchard", "transparent-inputs", "unstable", "serde"] }
pczt = { version = "0.9.1", optional = true, features = ["signer"] }
zcash_keys = { version = "0.16.1", optional = true, features = ["orchard"] }
# `local-consensus` exposes `LocalNetwork`, the regtest parameters used for a
# local devnet (see `WalletNetwork::Regtest`).
zcash_protocol = { version = "0.10.3", optional = true, features = ["local-consensus"] }
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport", "tls-webpki-roots"] }
# SQLCipher (bundled amalgamation) so the per-group wallet database is encrypted
# at rest. Feature-unifies with zcash_client_sqlite's `bundled` rusqlite: the
# single libsqlite3-sys build compiles the SQLCipher amalgamation. Uses vendored
# OpenSSL (compiled from source) so no system libssl-dev / openssl headers are
# required on the build machine — only a C toolchain + perl.
rusqlite = { version = "0.37", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }
prost = { version = "0.14", optional = true }
async-trait = { version = "0.1", optional = true }
zcash_primitives = { version = "0.30.0", optional = true }

[features]
# Orchard FVK / unified-address derivation from group key material.
zcash = ["dep:orchard", "dep:zcash_address", "dep:pasta_curves", "dep:ff", "dep:zcash_protocol"]
# Light-client wallet: sync, balances, and PCZT transaction building.
wallet = [
    "zcash",
    "dep:zcash_client_backend",
    "dep:zcash_client_sqlite",
    "dep:zcash_keys",
    "dep:zcash_protocol",
    "dep:tonic",
    "dep:rusqlite",
    "dep:prost",
    "dep:async-trait",
    "dep:zcash_primitives",
    "dep:pczt",
]

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `zcash_unstable = "nu7"` is the zcash crates' opt-in for the next upgrade; the
# regtest `LocalNetwork` literal in wallet.rs must follow it to stay buildable.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7", "nutachyon"))'] }
