[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "frost-app"
version = "0.3.0-rc.1"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
frost-app-core = { path = "core", features = ["wallet"] }
frost-client = { workspace = true }
frost-core = { workspace = true }
frost-ed25519 = { workspace = true }
frost-rerandomized = { workspace = true }
reddsa = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Native save/open dialogs, opened from Rust for key backups (commands/backup.rs).
# 2.7.x: 2.8 requires Tauri 2.12, a framework upgrade of its own.
tauri-plugin-dialog = "~2.7.3"
# System notifications for approval requests, sent from Rust (commands/notify.rs).
# 2.4.x for the same reason: 2.5 requires Tauri 2.12.
tauri-plugin-notification = "~2.4.0"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
postcard = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# tests/devnet_send.rs: a throwaway recipient key (same crate the core uses).
orchard = { package = "zakura-orchard", version = "=4.0.0" }

[lib]
name = "frost_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace.dependencies]
frost-client = { git = "https://github.com/ZcashFoundation/frost-tools.git", rev = "3d2985cfbc5df9314f3882a6d693bbe0d711051f" }
frost-core = { version = "2.2.0", features = ["serde"] }
frost-ed25519 = { version = "2.0.0", features = ["serde"] }
frost-rerandomized = { version = "2.0.0-rc.0", features = ["serde"] }
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
thiserror = "2"
zeroize = { version = "1.8", features = ["serde", "zeroize_derive"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = "0.7"
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = "2"
rcgen = "0.13"
postcard = "1.1"
bech32 = "0.11"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64 = "0.22"
