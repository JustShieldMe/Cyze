# cargo-deny configuration, run in CI as `cargo deny check advisories licenses`.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Vulnerabilities always fail the check. Yanked crates fail too: a yanked
# release usually means "don't use this one".
yanked = "deny"
# Fail for unmaintained crates we depend on directly; transitive ones (deep in
# the Tauri and Zcash trees) are reported but don't fail the build, since only
# upstream can replace them.
unmaintained = "workspace"
# Anything listed here must say why it is safe to ignore and when to revisit.
ignore = [
    # rsa (Marvin attack): key recovery through timing of RSA *private-key*
    # operations. It comes in through arti (optional Tor for wallet traffic),
    # which as a client only verifies RSA signatures, with public keys. No
    # fixed release exists; revisit when arti drops rsa or one does.
    { id = "RUSTSEC-2023-0071", reason = "only RSA public-key verification is used (arti client)" },
]

[licenses]
# What Cyze accepts in what it ships, kept in step with about.toml (which
# writes the bundled third-party notices). Anything else fails CI.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # File-level copyleft (cssparser and friends, via Tauri): unmodified, with
    # their source public on crates.io.
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Cyze's own crates aren't published.
ignore = true

# frost-client (ZcashFoundation/frost-tools) is dual MIT/Apache-2.0 per the
# LICENSE-MIT and LICENSE-APACHE at its repository root, but its Cargo.toml has
# no license field. Revisit when the pinned revision (scripts/PINNED_REV) moves.
[[licenses.clarify]]
crate = "frost-client"
expression = "MIT OR Apache-2.0"
license-files = []
